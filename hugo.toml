######################## default configuration ####################
# The live domain. The github.io URL this used to name still resolves, but only
# via a redirect, and it is no longer where anyone reads the site.
baseURL = "https://brief-tech-news.com/"
title = "BriefTechNews.com"
theme = "editor-hugo"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "Europe/Berlin"
# post pagination
pagination.pagerSize = 6 # see https://gohugo.io/extras/pagination/
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/excerpts/
# English serves at the site root, German at /de/. Set explicitly rather than left to
# Hugo's "en" default: it was only correct by accident while there was one language, and
# getting it wrong moves every live English URL under a language prefix.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableLanguages = [
] # example: ["de"] for disable german language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage


########################### Services #############################
[services]
[services.googleAnalytics]
# ID = 'G-MEASUREMENT_ID' # see https://gohugo.io/templates/internal/#configure-google-analytics -- no real GA property yet, fill in when one exists


############################# Build ##############################
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = '(js|scripts|javascript)'
[[build.cachebusters]]
source = 'assets/.*\.(css|sass|scss)$'
target = '(css|styles|scss|sass)'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'


############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS", "JSON"]

############################# Imaging ##############################
[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 90
resampleFilter = "Lanczos"

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe = true

############################# Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "plugins/bootstrap/bootstrap.min.css"
[[params.plugins.css]]
link = "plugins/slick/slick.css"

# JS Plugins
[[params.plugins.js]]
link = "plugins/jquery/jquery.min.js"
[[params.plugins.js]]
link = "plugins/bootstrap/bootstrap.min.js"
[[params.plugins.js]]
link = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/js/all.min.js"
attributes = "crossorigin='anonymous' defer='defer' data-search-pseudo-elements"
[[params.plugins.js]]
link = "plugins/slick/slick.min.js"
[[params.plugins.js]]
link = "plugins/search/fuse.min.js"
[[params.plugins.js]]
link = "plugins/search/mark.js"
[[params.plugins.js]]
link = "plugins/search/search.js"

#################### default parameters ################################
[params]
favicon = "images/logo-sm.svg"
logo_text = "BriefTechNews"
logo = "images/logo.png"
logo_height = "26px"
logo_rotate = true
# Meta data
description = "Daily engineering-focused digests across AI, tech, crypto and fintech."
# contact info
# address = "9567 Turner Trace Apt. BC C3G8A4" # template placeholder, not a real address
# mobile = "+211234565523" # template placeholder, not a real number
email = "hello@brieftechnews.com"
# contact form action
contact_form_action = "#" # contact form works with https://formspree.io
# Search
search = true
# Main section
mainSections = ["blogs"]
# custom script on header
custom_script= ""

# OpenRemark comments
[params.open_remark]
enable = false # disabled until a real site key is set up; the theme's demo key was here
# site_key = "cmqnb3wd5000104kww7862ku4" # your site key from the OpenRemark dashboard
embed_url = "https://open-remark.zeon.studio/embed.js"

# site variables
[params.variables]
# color variables
primary_color = "#c98664"
secondary_color = "#c98665"
white = "#ffffff"
black = "#000000"
dark = "#2B2C2E"
gray = "#66676d"
light = "#a8aab2"

# font-size variables
h1 = "68px"
h1_lg = "52px"
h1_md = "40px"
h2 = "42px"
h2_md = "36px"
h3 = "32px"
h3_md = "28px"
h4 = "24px"
h5 = "18px"
h6 = "16px"

# font variable
# Give your font name from google font. add font weight using ":wght@" and separate by ";"
# example: "Work Sans:wght@400;600;700"
primary_font = "Lora:wght@500;600"
secondary_font = "Work Sans:wght@400;500;600"
icon_font = "Font Awesome 5 Free"

# Preloader
[params.preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Subscription -- posts to the shared DataFortress funnel API's email-list
# endpoint (POST {endpoint}/{site_key}/{list_key}), handled client-side by
# assets/js/script.js. The site must be registered in that service's
# sites.yaml (site key "brieftechnews", list key "newsletter") with this
# site's origins allow-listed, or the browser fetch will be blocked by CORS.
#
# The topic checkboxes are rendered from data/categories.yaml -- the same file
# the homepage strip and the RSS row read -- so a beat is offered here by being
# published, not by being listed a third time. Their slugs must match the
# `topics:` allow-list on this site's list in that service's sites.yaml: a beat
# missing there submits fine and is dropped server-side.
[params.subscription]
enable = true
endpoint = "https://ecommerce-api.datafortress.cloud/v1/lists"
site_key = "brieftechnews"
list_key = "newsletter"
# Exit-intent dialog. `arm_after` is how many seconds of reading must pass
# before it may open at all -- a signup prompt that fires before the visitor
# has read anything asks for a decision they have no basis to make. A dismissal
# is remembered locally for `dismiss_days`, and a completed signup suppresses it
# for good.
exit_intent = true
exit_intent_arm_after = 12
exit_intent_dismiss_days = 30

# Meta pixel. Public by design -- it is compiled into every page that loads the
# pixel, so it is config and not a secret. It is only ever started after the
# consent banner below is accepted; empty means the site has no pixel at all.
# The same id is configured server-side in the funnel API's sites.yaml, which
# reports the newsletter signup through the Conversions API against it.
[params.meta]
pixel_id = "995037776892621"

# Marketing-consent banner. Now load-bearing rather than decorative: it is the
# only thing that starts the pixel, and the answer is sent on to the funnel API
# so the server-side conversion honours it too.
#
# `expire_days` is how long an answer is remembered. Two days was fine for a
# banner that did nothing; for a real choice it means re-asking someone who
# already said no, twice a week. Six months is the usual reading of "not
# excessive" without being indefinite.
[params.cookies]
enable = true
expire_days = 180


######################## sidebar widgets #########################
[params.widgets]
# "subscription" sits directly under the post it followed, while the reader is
# still holding the reason to sign up.
sidebar = ["subscription", "about-me", "recent-post", "categories", "tags"]
# available widget : search,about-me,authors,categories,tags,recent-post,social,promotion,subscription

